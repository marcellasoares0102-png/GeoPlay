<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Interactive Maps</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    
    <style>
        body {
            background-color: #050505; /* Pitch black base - More black than blue */
            color: #f8fafc;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(255, 255, 255, 0.02), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(255, 255, 255, 0.02), transparent 30%);
        }

        .liquid-glass {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.8), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
        }

        .liquid-glass-input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            transition: all 0.3s ease;
        }

        .liquid-glass-input:focus {
            background: rgba(20, 20, 20, 0.9);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
            outline: none;
        }

        .map-container {
            position: relative;
            width: 100%;
            height: calc(100vh - 180px); /* Fill remaining space below header */
            min-height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 1.5rem;
        }

        svg {
            width: 100%;
            height: 100%;
            max-height: 800px;
        }

        /* Interactive map features (States/Provinces/Countries) */
        .map-feature {
            cursor: pointer;
            stroke: rgba(255, 255, 255, 0.6);
            stroke-width: 0.8;
            transition: fill 0.3s, stroke-width 0.2s, stroke 0.2s, filter 0.3s;
        }

        .map-feature:hover:not(.answered) {
            fill-opacity: 0.8;
            stroke: #ffffff;
            stroke-width: 2;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
        }

        .map-feature.active:not(.answered) {
            stroke: #ffffff;
            stroke-width: 3;
            fill-opacity: 1 !important;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.5));
        }

        /* Answered State (Greyed out) */
        .map-feature.answered, .pin.answered {
            fill: #334155 !important; /* Slate 700 */
            stroke: #1e293b !important; /* Slate 800 */
            fill-opacity: 0.5 !important;
            cursor: default;
            pointer-events: none;
            filter: none !important;
        }

        .feature-label {
            fill: #ffffff;
            font-size: 10px;
            font-weight: 700;
            text-anchor: middle;
            pointer-events: none;
            text-shadow:
                -1px -1px 0 #000,  
                 1px -1px 0 #000,
                -1px  1px 0 #000,
                 1px  1px 0 #000;
        }
        
        .feature-label-small {
            font-size: 7.5px;
        }

        .answered-label {
            fill: #64748b; /* Slate 500 */
            text-shadow: none;
        }

        .pin-visual {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .pin:hover:not(.answered) .pin-visual {
            transform: scale(1.2) translateY(-5px);
        }

        .pin.active:not(.answered) .pin-visual path {
            stroke: #ffffff;
            stroke-width: 3;
        }

        .tooltip {
            position: absolute;
            opacity: 0;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            pointer-events: none;
            font-size: 0.875rem;
            font-weight: 600;
            transition: opacity 0.2s;
            z-index: 100;
            transform: translate(-50%, -100%);
            margin-top: -10px;
        }

        .globe-feature {
            fill: #525252; /* Medium neutral gray for locked continents */
            stroke: #262626; /* Darker border */
            stroke-width: 0.5;
            transition: fill 0.3s;
        }
        .globe-highlight {
            fill: #f8fafc; /* White for target areas */
            cursor: pointer;
            transition: fill 0.3s, filter 0.3s;
        }
        .globe-highlight.hovered {
            fill: #a3a3a3; /* Light grey when hovered */
            filter: drop-shadow(0 0 12px rgba(255,255,255,0.4));
        }

        /* Transitions */
        .fade-enter { opacity: 0; transform: translateY(10px); }
        .fade-enter-active { opacity: 1; transform: translateY(0); transition: opacity 300ms, transform 300ms; }
        .fade-exit { opacity: 1; transform: translateY(0); }
        .fade-exit-active { opacity: 0; transform: translateY(-10px); transition: opacity 300ms, transform 300ms; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-100 relative">

    <main class="w-full max-w-6xl mx-auto p-4 flex-1 flex flex-col relative z-10">

            </div>
            
            <!-- Globe Container -->
            <div id="globe-container" class="w-full max-w-2xl aspect-square cursor-grab active:cursor-grabbing relative">
                <!-- D3 Globe injected here -->
            </div>

                <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-white"></div> Available</div>
                <div class="flex items-center gap-2"><div class="w-3 h-3 rounded-full bg-slate-800 border border-slate-600"></div> Coming Soon</div>
            </div>
        </div>

        <div id="quiz-view" class="hidden flex-1 flex-col space-y-6 transition-opacity duration-500 opacity-0 pb-10">
            
            <!-- Header: Title, Score, Home Button -->
            <div class="liquid-glass rounded-2xl p-4 md:p-6 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-4">
                    <button onclick="goHome()" class="p-3 rounded-xl bg-slate-800/50 hover:bg-slate-700/80 border border-slate-600/50 text-slate-300 transition-colors group">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="group-hover:-translate-x-1 transition-transform"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                    </button>
                    <div>
                        <h2 id="quiz-title" class="text-3xl font-extrabold text-white tracking-tight">Region Map</h2>
                        <div id="legend-container" class="flex flex-wrap gap-3 text-xs font-semibold text-slate-300 mt-2">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>
                
                <div class="bg-slate-900/60 border border-slate-700/50 px-6 py-3 rounded-xl text-center shadow-inner min-w-[140px]">
                    <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">Score</p>
                    <p class="text-3xl font-black text-white"><span id="score-display">0</span> <span class="text-base text-slate-500 font-semibold" id="score-total">/ 0</span></p>
                </div>
            </div>

            <!-- Map Area -->
            <div class="map-container liquid-glass" id="map-container">
                <div id="tooltip" class="tooltip liquid-glass border border-white/10"></div>
                <!-- D3 Map injected here -->
                
                <div id="form-card" class="absolute top-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md liquid-glass p-6 rounded-2xl hidden opacity-0 transition-all duration-300 transform scale-95 shadow-2xl border-t border-l border-white/20 z-50">
                    
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex items-center gap-3">
                            <div class="h-12 w-12 rounded-full bg-white/5 flex items-center justify-center border border-white/20 overflow-hidden shrink-0 shadow-inner relative">
                                <img id="selected-flag" src="" alt="Flag" class="w-full h-full object-cover hidden absolute inset-0">
                                <span id="selected-abbr" class="text-sm font-bold text-slate-300"></span>
                            </div>
                            <div>
                                <h3 class="text-lg font-bold text-white leading-tight">Identify Region</h3>
                                <p class="text-xs text-slate-400">Enter name and capital.</p>
                            </div>
                        </div>
                        <button onclick="closeForm()" class="text-slate-400 hover:text-white p-1 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        </button>
                    </div>

                    <form id="quiz-form" class="space-y-4">
                        <input type="hidden" id="current-id">
                        
                        <div class="space-y-3">
                            <div>
                                <input type="text" id="name-input" class="w-full px-4 py-2.5 rounded-lg liquid-glass-input text-sm" placeholder="Name (e.g. California, France)" required autocomplete="off">
                            </div>
                            <div>
                                <input type="text" id="capital-input" class="w-full px-4 py-2.5 rounded-lg liquid-glass-input text-sm" placeholder="Capital City" required autocomplete="off">
                            </div>
                        </div>

                        <div id="hint-container" class="mt-2 hidden">
                            <div id="region-hint" class="flex gap-4 justify-center items-center bg-white/5 p-3 rounded-xl border border-white/10"></div>
                        </div>

                        <div id="feedback-message" class="text-sm font-semibold text-center hidden py-2 rounded-lg bg-red-500/20 text-red-300 border border-red-500/30">
                            Try again!
                        </div>

                        <button type="submit" class="w-full bg-white text-slate-900 hover:bg-slate-200 font-bold py-2.5 rounded-lg shadow-lg transition-all active:scale-[0.98]">
                            Confirm
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </main>

        function initGlobe() {
            const width = 600;
            const height = 600;
            const container = d3.select("#globe-container");
            container.selectAll("*").remove();

            const svg = container.append("svg")
                .attr("viewBox", `0 0 ${width} ${height}`)
                .style("width", "100%")
                .style("height", "100%");

            const projection = d3.geoOrthographic()
                .scale(280)
                .translate([width / 2, height / 2])
                .clipAngle(90)
                .precision(0.1);

            const path = d3.geoPath().projection(projection);

            // Ocean
            svg.append("circle")
                .attr("cx", width / 2)
                .attr("cy", height / 2)
                .attr("r", projection.scale())
                .attr("fill", "rgba(10, 10, 10, 0.5)")
                .attr("stroke", "rgba(255, 255, 255, 0.05)");

            const graticule = d3.geoGraticule();
            svg.append("path")
                .datum(graticule)
                .attr("class", "graticule")
                .attr("d", path)
                .attr("fill", "none")
                .attr("stroke", "rgba(255, 255, 255, 0.05)")
                .attr("stroke-width", 0.5);

            const g = svg.append("g");

            // Load low-res world map for the globe
            d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {
                const countries = topojson.feature(world, world.objects.countries).features;

                // Fix South America bug: Remove French Guiana from France's MultiPolygon
                const france = countries.find(c => String(c.id).padStart(3, '0') === "250");
                if (france && france.geometry && france.geometry.type === "MultiPolygon") {
                    france.geometry.coordinates = france.geometry.coordinates.filter(polygon => {
                        const lon = polygon[0][0][0];
                        const lat = polygon[0][0][1];
                        // Keep polygons in mainland Europe approximately
                        return lon > -10 && lon < 20 && lat > 35;
                    });
                }

                g.selectAll("path")
                    .data(countries)
                    .join("path")
                    .attr("d", path)
                    .attr("class", d => {
                        const id = String(d.id).padStart(3, '0');
                        if (id === usaGlobeId || id === canadaGlobeId) {
                            return "globe-feature globe-highlight";
                        } else if (europeGlobeIds.includes(id)) {
                            return "globe-feature globe-highlight europe-group";
                        } else if (latamGlobeIds.includes(id)) {
                            return "globe-feature globe-highlight latam-group";
                        }
                        return "globe-feature";
                    })
                    .on("click", (event, d) => {
                        const id = String(d.id).padStart(3, '0');
                        if (id === usaGlobeId) startQuiz('usa');
                        else if (id === canadaGlobeId) startQuiz('canada');
                        else if (europeGlobeIds.includes(id)) startQuiz('europe');
                        else if (latamGlobeIds.includes(id)) startQuiz('latam');
                    })
                    .on("mouseover", function(event, d) {
                        const id = String(d.id).padStart(3, '0');
                        if (europeGlobeIds.includes(id)) {
                            d3.selectAll(".europe-group").classed("hovered", true);
                        } else if (latamGlobeIds.includes(id)) {
                            d3.selectAll(".latam-group").classed("hovered", true);
                        } else if (id === usaGlobeId || id === canadaGlobeId) {
                            d3.select(this).classed("hovered", true);
                        }
                    })
                    .on("mouseout", function(event, d) {
                        const id = String(d.id).padStart(3, '0');
                        if (europeGlobeIds.includes(id)) {
                            d3.selectAll(".europe-group").classed("hovered", false);
                        } else if (latamGlobeIds.includes(id)) {
                            d3.selectAll(".latam-group").classed("hovered", false);
                        } else if (id === usaGlobeId || id === canadaGlobeId) {
                            d3.select(this).classed("hovered", false);
                        }
                    });

                // Auto rotation
                let timer = d3.timer(function(elapsed) {
                    projection.rotate([elapsed * 0.01, -20]);
                    g.selectAll("path").attr("d", path);
                });

                // Drag interaction
                const drag = d3.drag()
                    .on("start", () => timer.stop())
                    .on("drag", (event) => {
                        const rotate = projection.rotate();
                        const k = 75 / projection.scale();
                        projection.rotate([
                            rotate[0] + event.dx * k,
                            rotate[1] - event.dy * k
                        ]);
                        g.selectAll("path").attr("d", path);
                    });

                svg.call(drag);
            });
        }

        function renderUSA() {
            const width = 975, height = 610;
            const svg = createMapSvg(width, height);
            const path = d3.geoPath();

            d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-albers-10m.json").then(us => {
                const states = topojson.feature(us, us.objects.states).features;

                // Draw Features
                svg.append("g").selectAll("path")
                    .data(states)
                    .join("path")
                    .attr("class", "map-feature")
                    .attr("data-id", d => d.id.padStart(2, '0'))
                    .attr("d", path)
                    .attr("fill", d => {
                        const id = d.id.padStart(2, '0');
                        return stateData[id] ? usaRegionColors[stateData[id].region] : "rgba(255,255,255,0.1)";
                    })
                    .call(attachInteractions);

                // Add internal boundaries mesh for extra clarity
                svg.append("path")
                    .datum(topojson.mesh(us, us.objects.states, (a, b) => a !== b))
                    .attr("fill", "none")
                    .attr("stroke", "rgba(255, 255, 255, 0.4)")
                    .attr("stroke-width", 1)
                    .attr("stroke-linejoin", "round")
                    .attr("pointer-events", "none");

                // Add Labels
                svg.append("g").attr("class", "labels-group").selectAll("text")
                    .data(states)
                    .join("text")
                    .attr("class", d => {
                        const abbr = stateData[d.id.padStart(2, '0')]?.abbr || "";
                        return ["CT", "RI", "DE", "MD", "NJ", "MA", "NH", "VT"].includes(abbr) ? "feature-label feature-label-small" : "feature-label";
                    })
                    .attr("transform", d => {
                        const centroid = path.centroid(d);
                        const id = d.id.padStart(2, '0');
                        const abbr = stateData[id]?.abbr || "";
                        let x = centroid[0], y = centroid[1];
                        if (abbr === "FL") x += 15;
                        if (abbr === "MI") { x += 10; y += 20; }
                        if (abbr === "LA") x -= 10;
                        if (abbr === "ID") y += 15;
                        if (abbr === "CA") { x -= 10; y += 10;}
                        if (abbr === "AK") y -= 10;
                        if (abbr === "HI") x += 10;
                        if (isNaN(x) || isNaN(y)) return `translate(-1000,-1000)`;
                        return `translate(${x},${y})`;
                    })
                    .attr("dy", ".35em")
                    .attr("data-id", d => d.id.padStart(2, '0'))
                    .text(d => stateData[d.id.padStart(2, '0')]?.abbr || "");

                drawCompass(svg, 900, 520);
            });
        }

        function renderCanada() {
            const width = 975, height = 610;
            const svg = createMapSvg(width, height);
            
            const projection = d3.geoConicConformal().rotate([96, 0]).center([0, 62]).parallels([49, 77]).scale(700).translate([width / 2, height / 2]);
            const path = d3.geoPath().projection(projection);

            d3.json("https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/canada.geojson").then(canada => {
                const provinces = canada.features;

                svg.append("g").selectAll("path")
                    .data(provinces)
                    .join("path")
                    .attr("class", "map-feature")
                    .attr("data-id", d => getCanadaId(d))
                    .attr("d", path)
                    .attr("fill", d => {
                        let name = getCanadaId(d);
                        return provinceData[name] ? canadaRegionColors[provinceData[name].region] : "rgba(255,255,255,0.1)";
                    })
                    .call(attachInteractions);

                svg.append("g").attr("class", "labels-group").selectAll("text")
                    .data(provinces)
                    .join("text")
                    .attr("class", d => {
                        let name = getCanadaId(d);
                        const abbr = provinceData[name]?.abbr || "";
                        return ["PE", "NS", "NB"].includes(abbr) ? "feature-label feature-label-small" : "feature-label";
                    })
                    .attr("transform", d => {
                        const centroid = path.centroid(d);
                        let name = getCanadaId(d);
                        const abbr = provinceData[name]?.abbr || "";
                        let x = centroid[0], y = centroid[1];
                        
                        if (abbr === "NU") { x -= 20; y += 40; }
                        if (abbr === "NT") { x += 30; y += 30; }
                        if (abbr === "NL") { x += 25; y += 15; }
                        if (abbr === "BC") { x -= 10; y -= 10; }
                        if (abbr === "ON") { x -= 15; y += 30; }
                        if (abbr === "QC") y += 30;
                        if (abbr === "PE") x += 5;
                        
                        if (isNaN(x) || isNaN(y)) return `translate(-1000,-1000)`;
                        return `translate(${x},${y})`;
                    })
                    .attr("dy", ".35em")
                    .attr("data-id", d => getCanadaId(d))
                    .text(d => {
                        let name = getCanadaId(d);
                        return provinceData[name]?.abbr || "";
                    });

                drawCompass(svg, 900, 520);
            });
        }

        function renderEurope() {
            const width = 975, height = 650;
            const svg = createMapSvg(width, height);
            
            const projection = d3.geoMercator().center([12, 51]).scale(620).translate([width / 2, height / 2]);
            const path = d3.geoPath().projection(projection);

            Promise.all([
                d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json"),
                d3.json("https://bost.ocks.org/mike/map/uk.json")
            ]).then(([world, uk]) => {
                let countries = topojson.feature(world, world.objects.countries).features;
                countries = countries.filter(d => String(d.id).padStart(3, '0') !== "826"); // Remove UK
                
                // Filter out French Guiana from France in 50m data
                const france = countries.find(c => String(c.id).padStart(3, '0') === "250");
                if (france && france.geometry && france.geometry.type === "MultiPolygon") {
                    france.geometry.coordinates = france.geometry.coordinates.filter(polygon => {
                        const lon = polygon[0][0][0];
                        const lat = polygon[0][0][1];
                        return lon > -10 && lon < 30 && lat > 35;
                    });
                }

                const ukSubunits = topojson.feature(uk, uk.objects.subunits).features;
                const ukCountries = ukSubunits.filter(d => d.id !== "IRL");
                countries = countries.concat(ukCountries);

                // Draw Features
                svg.append("g").selectAll("path")
                    .data(countries)
                    .join("path")
                    .attr("data-id", d => String(d.id).padStart(3, '0'))
                    .attr("class", d => {
                        const id = String(d.id).padStart(3, '0');
                        return countryData[id] ? "map-feature" : "non-interactive";
                    })
                    .attr("d", path)
                    .attr("fill", d => {
                        const id = String(d.id).padStart(3, '0');
                        return countryData[id] ? euRegionColors[countryData[id].region] : "rgba(255,255,255,0.05)";
                    })
                    .call(attachInteractions);

                // Add internal boundaries mesh for extra clarity
                svg.append("path")
                    .datum(topojson.mesh(world, world.objects.countries, (a, b) => a !== b))
                    .attr("fill", "none")
                    .attr("stroke", "rgba(255, 255, 255, 0.3)")
                    .attr("stroke-width", 0.5)
                    .attr("stroke-linejoin", "round")
                    .attr("pointer-events", "none");

                // Draw Labels
                svg.append("g").attr("class", "labels-group").selectAll("text")
                    .data(countries.filter(d => {
                        const id = String(d.id).padStart(3, '0');
                        return countryData[id] && !microstates.includes(id);
                    }))
                    .join("text")
                    .attr("class", d => {
                        const abbr = countryData[String(d.id).padStart(3, '0')].abbr;
                        return ["CY", "ME", "MK", "SI", "XK", "WLS", "NIR"].includes(abbr) ? "feature-label feature-label-small" : "feature-label";
                    })
                    .attr("transform", d => {
                        const id = String(d.id).padStart(3, '0');
                        const abbr = countryData[id].abbr;
                        let point = euCentroids[abbr] ? projection(euCentroids[abbr]) : path.centroid(d);
                        if (isNaN(point[0]) || isNaN(point[1])) return `translate(-1000,-1000)`;
                        return `translate(${point[0]},${point[1]})`;
                    })
                    .attr("dy", ".35em")
                    .attr("data-id", d => String(d.id).padStart(3, '0'))
                    .text(d => countryData[String(d.id).padStart(3, '0')].abbr);

                // Microstate Pins
                svg.append("g").attr("class", "pins-group").selectAll("g")
                    .data(countries.filter(d => microstates.includes(String(d.id).padStart(3, '0'))))
                    .join("g")
                    .attr("class", "pin map-feature")
                    .attr("data-id", d => String(d.id).padStart(3, '0'))
                    .attr("transform", d => {
                        const id = String(d.id).padStart(3, '0');
                        const abbr = countryData[id].abbr;
                        let point = euCentroids[abbr] ? projection(euCentroids[abbr]) : path.centroid(d);
                        return `translate(${point[0]},${point[1]})`;
                    })
                    .call(attachInteractions)
                    .call(g => {
                        const visual = g.append("g").attr("class", "pin-visual");
                        visual.append("ellipse").attr("cx", 0).attr("cy", 0).attr("rx", 4).attr("ry", 2).attr("fill", "rgba(0,0,0,0.5)");
                        visual.append("path")
                            .attr("d", "M 0 0 C -6 -9 -12 -16 -12 -24 C -12 -30.6 -6.6 -36 0 -36 C 6.6 -36 12 -30.6 12 -24 C 12 -16 6 -9 0 0 Z")
                            .attr("fill", "#6366f1")
                            .attr("stroke", "#1e293b").attr("stroke-width", 1);
                        visual.append("circle").attr("cx", 0).attr("cy", -24).attr("r", 4).attr("fill", "#ffffff");
                    });

                drawCompass(svg, 900, 560);
            });
        }

        function renderLatam() {
            const width = 975, height = 650;
            const svg = createMapSvg(width, height);
            
            const projection = d3.geoMercator().center([-75, -15]).scale(280).translate([width / 2, height / 2]);
            const path = d3.geoPath().projection(projection);

            d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json").then(world => {
                let countries = topojson.feature(world, world.objects.countries).features;

                // Draw Features
                svg.append("g").selectAll("path")
                    .data(countries)
                    .join("path")
                    .attr("data-id", d => String(d.id).padStart(3, '0'))
                    .attr("class", d => {
                        const id = String(d.id).padStart(3, '0');
                        return latamData[id] ? "map-feature" : "non-interactive";
                    })
                    .attr("d", path)
                    .attr("fill", d => {
                        const id = String(d.id).padStart(3, '0');
                        return latamData[id] ? latamRegionColors[latamData[id].region] : "rgba(255,255,255,0.05)";
                    })
                    .call(attachInteractions);

                // Add internal boundaries mesh
                svg.append("path")
                    .datum(topojson.mesh(world, world.objects.countries, (a, b) => a !== b))
                    .attr("fill", "none")
                    .attr("stroke", "rgba(255, 255, 255, 0.3)")
                    .attr("stroke-width", 0.5)
                    .attr("stroke-linejoin", "round")
                    .attr("pointer-events", "none");

                // Draw Labels
                svg.append("g").attr("class", "labels-group").selectAll("text")
                    .data(countries.filter(d => {
                        const id = String(d.id).padStart(3, '0');
                        return latamData[id];
                    }))
                    .join("text")
                    .attr("class", d => {
                        const abbr = latamData[String(d.id).padStart(3, '0')].abbr;
                        return ["BZ", "CR", "SV", "GT", "HN", "NI", "PA", "GY", "SR", "HT", "DO", "JM", "BS"].includes(abbr) ? "feature-label feature-label-small" : "feature-label";
                    })
                    .attr("transform", d => {
                        const id = String(d.id).padStart(3, '0');
                        let point = path.centroid(d);
                        
                        // Manual adjustments
                        if (id === "152") { // Chile
                            point[0] -= 15;
                            point[1] += 30;
                        }
                        if (id === "032") { // Argentina
                            point[0] -= 10;
                        }

                        if (isNaN(point[0]) || isNaN(point[1])) return `translate(-1000,-1000)`;
                        return `translate(${point[0]},${point[1]})`;
                    })
                    .attr("dy", ".35em")
                    .attr("data-id", d => String(d.id).padStart(3, '0'))
                    .text(d => latamData[String(d.id).padStart(3, '0')].abbr);

                drawCompass(svg, 900, 560);
            });
        }

        function createMapSvg(width, height) {
            return d3.select("#map-container").insert("svg", ":first-child")
                .attr("viewBox", `0 0 ${width} ${height}`)
                .attr("preserveAspectRatio", "xMidYMid meet");
        }

        function drawCompass(svg, x, y) {
            const compass = svg.append("g").attr("transform", `translate(${x}, ${y}) scale(1.1)`);
            
            // Minimalist skeleton star (lines only)
            compass.append("line").attr("x1", 0).attr("y1", -30).attr("x2", 0).attr("y2", 30)
                .attr("stroke", "rgba(255,255,255,0.25)").attr("stroke-width", 1.5);
            compass.append("line").attr("x1", -30).attr("y1", 0).attr("x2", 30).attr("y2", 0)
                .attr("stroke", "rgba(255,255,255,0.25)").attr("stroke-width", 1.5);
            
            // Tiny center dot
            compass.append("circle").attr("cx", 0).attr("cy", 0).attr("r", 1.5).attr("fill", "rgba(255,255,255,0.5)");
            
            const style = "font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 400; fill: rgba(255,255,255,0.4); letter-spacing: 1px;";
            compass.append("text").attr("x", 0).attr("y", -38).style("text-anchor", "middle").text("N").attr("style", style);
            compass.append("text").attr("x", 0).attr("y", 46).style("text-anchor", "middle").text("S").attr("style", style);
            compass.append("text").attr("x", 38).attr("y", 4).style("text-anchor", "start").text("E").attr("style", style);
            compass.append("text").attr("x", -38).attr("y", 4).style("text-anchor", "end").text("W").attr("style", style);
        }

        function attachInteractions(selection) {
            selection
                .on("mouseover", function(event, d) {
                    // Ignore non-interactive background elements
                    if(d3.select(this).classed("non-interactive")) return;
                    
                    let id = d3.select(this).attr("data-id");
                    if (!id) return;
                    
                    if (d3.select(this).classed("answered")) return; // Don't highlight answered

                    const info = activeDataMap[id];
                    if (info) {
                        tooltip.transition().duration(200).style("opacity", 1);
                        tooltip.html(info.abbr).style("left", (event.pageX) + "px").style("top", (event.pageY - 15) + "px");
                        
                        // Raise element to front (unless it's a pin, which is already in a top group)
                        if(!d3.select(this).classed("pin")){
                            d3.select(this).raise();
                        }
                    }
                })
                .on("mousemove", function(event) {
                    tooltip.style("left", (event.pageX) + "px").style("top", (event.pageY - 15) + "px");
                })
                .on("mouseout", function() {
                    tooltip.transition().duration(200).style("opacity", 0);
                    // Labels should always stay on top
                    d3.select(".labels-group").raise();
                    d3.select(".pins-group").raise();
                })
                .on("click", function(event, d) {
                    if(d3.select(this).classed("non-interactive") || d3.select(this).classed("answered")) return;
                    
                    let id = d3.select(this).attr("data-id");
                    const info = activeDataMap[id];
                    if (!info) return;

                    if (activeFeature === this) {
                        closeForm();
                        return;
                    }

                    // Reset previous active
                    d3.selectAll(".map-feature.active").classed("active", false);
                    
                    // Set new active
                    activeFeature = this;
                    d3.selectAll(`.map-feature[data-id="${id}"]`).classed("active", true).raise();
                    
                    // Keep labels and pins above everything
                    d3.select(".labels-group").raise();
                    d3.select(".pins-group").raise();

                    openForm(id, info);
                });
        }

        function openForm(id, info) {
            document.getElementById('current-id').value = id;
            
            let flagUrl = "";
            if (currentRegion === 'usa') {
                flagUrl = `https://flagcdn.com/w80/us-${info.abbr.toLowerCase()}.png`;
            } else if (currentRegion === 'europe') {
                let code = info.abbr.toLowerCase();
                if (code === 'eng') code = 'gb-eng';
                else if (code === 'sct') code = 'gb-sct';
                else if (code === 'wls') code = 'gb-wls';
                else if (code === 'nir') code = 'gb-nir';
                flagUrl = `https://flagcdn.com/w80/${code}.png`;
            } else if (currentRegion === 'latam') {
                flagUrl = `https://flagcdn.com/w80/${info.abbr.toLowerCase()}.png`;
            } else if (currentRegion === 'canada') {
                const caFlags = {
                    "AB": "https://upload.wikimedia.org/wikipedia/commons/f/f5/Flag_of_Alberta.svg",
                    "BC": "https://upload.wikimedia.org/wikipedia/commons/b/b8/Flag_of_British_Columbia.svg",
                    "MB": "https://upload.wikimedia.org/wikipedia/commons/c/c4/Flag_of_Manitoba.svg",
                    "NB": "https://upload.wikimedia.org/wikipedia/commons/f/fb/Flag_of_New_Brunswick.svg",
                    "NL": "https://upload.wikimedia.org/wikipedia/commons/d/dd/Flag_of_Newfoundland_and_Labrador.svg",
                    "NS": "https://upload.wikimedia.org/wikipedia/commons/c/c0/Flag_of_Nova_Scotia.svg",
                    "ON": "https://upload.wikimedia.org/wikipedia/commons/8/88/Flag_of_Ontario.svg",
                    "PE": "https://upload.wikimedia.org/wikipedia/commons/d/d7/Flag_of_Prince_Edward_Island.svg",
                    "QC": "https://upload.wikimedia.org/wikipedia/commons/5/5f/Flag_of_Quebec.svg",
                    "SK": "https://upload.wikimedia.org/wikipedia/commons/b/bb/Flag_of_Saskatchewan.svg",
                    "NT": "https://upload.wikimedia.org/wikipedia/commons/c/c1/Flag_of_the_Northwest_Territories.svg",
                    "NU": "https://upload.wikimedia.org/wikipedia/commons/9/90/Flag_of_Nunavut.svg",
                    "YT": "https://upload.wikimedia.org/wikipedia/commons/6/69/Flag_of_Yukon.svg"
                };
                flagUrl = caFlags[info.abbr];
            }

            const flagImg = document.getElementById('selected-flag');
            const abbrSpan = document.getElementById('selected-abbr');

            if (flagUrl) {
                flagImg.src = flagUrl;
                flagImg.classList.remove('hidden');
                abbrSpan.classList.add('hidden');
            } else {
                flagImg.classList.add('hidden');
                abbrSpan.classList.remove('hidden');
                abbrSpan.textContent = info.abbr;
            }
            
            // Handle Sports Hints
            const hintContainer = document.getElementById('hint-container');
            const regionHint = document.getElementById('region-hint');
            if (info.hint) {
                regionHint.innerHTML = info.hint;
                hintContainer.classList.remove('hidden');
            } else {
                hintContainer.classList.add('hidden');
            }
            
            const form = document.getElementById('quiz-form');
            form.reset();
            const feedbackMsg = document.getElementById('feedback-message');
            feedbackMsg.className = "text-sm font-semibold text-center hidden py-2 rounded-lg";
            
            formCard.classList.remove('hidden');
            // Small delay to allow block render before transition
            setTimeout(() => {
                formCard.classList.remove('opacity-0', 'scale-95');
                formCard.classList.add('opacity-100', 'scale-100');
            }, 10);

            document.getElementById('name-input').focus();
        }

        function closeForm() {
            d3.selectAll(".map-feature.active").classed("active", false);
            activeFeature = null;
            
            formCard.classList.remove('opacity-100', 'scale-100');
            formCard.classList.add('opacity-0', 'scale-95');
            setTimeout(() => {
                formCard.classList.add('hidden');
            }, 300);
        }

        function normalizeString(str) {
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
        }

        // Levenshtein distance for typo detection
        function levenshtein(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = [];
            for (let i = 0; i <= b.length; i++) matrix[i] = [i];
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1, 
                            matrix[i][j - 1] + 1,     
                            matrix[i - 1][j] + 1      
                        );
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        document.getElementById('quiz-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const id = document.getElementById('current-id').value;
            const info = activeDataMap[id];
            
            const inputName = normalizeString(document.getElementById('name-input').value);
            const inputCapital = normalizeString(document.getElementById('capital-input').value);
            
            const realNameStr = info.name || id;
            const realName = normalizeString(realNameStr);
            const realCapitalStr = info.capital;
            const realCapital = normalizeString(realCapitalStr);
            
            let nameCorrect = (inputName === realName);
            if (!nameCorrect && activeAliases[id]) {
                nameCorrect = activeAliases[id].some(alias => normalizeString(alias) === inputName);
            }
            const capitalCorrect = (inputCapital === realCapital);

            const feedbackMsg = document.getElementById('feedback-message');
            feedbackMsg.className = "text-sm font-semibold text-center py-2 rounded-lg"; // reset classes

            if (nameCorrect && capitalCorrect) {
                // Correct
                if (!answeredSet.has(id)) {
                    answeredSet.add(id);
                    score++;
                    document.getElementById('score-display').textContent = score;
                    
                    // Turn feature(s) grey
                    d3.selectAll(`.map-feature[data-id="${id}"]`).classed("answered", true);
                    d3.selectAll(`text[data-id="${id}"]`).classed("answered-label", true);
                }
                feedbackMsg.classList.add('hidden');
                closeForm();
            } else {
                feedbackMsg.classList.remove('hidden');
                
                // Check Typos
                const nameDist = levenshtein(inputName, realName);
                const capDist = levenshtein(inputCapital, realCapital);
                
                const nameTypo = !nameCorrect && (nameDist <= 2 && realName.length > 3);
                const capTypo = !capitalCorrect && (capDist <= 2 && realCapital.length > 3);
                
                let isTypo = false;
                let msg = "Try again!";
                
                if (nameTypo && capTypo) {
                    msg = `Almost! It's ${realNameStr} and ${realCapitalStr}.`;
                    isTypo = true;
                } else if (nameTypo && capitalCorrect) {
                    msg = `Capital correct! Almost on name, it's ${realNameStr}.`;
                    isTypo = true;
                } else if (nameCorrect && capTypo) {
                    msg = `Name correct! Almost on capital, it's ${realCapitalStr}.`;
                    isTypo = true;
                } else if (nameTypo) {
                    msg = `Almost on name! It's ${realNameStr}. Try again for capital.`;
                    isTypo = true;
                } else if (capTypo) {
                    msg = `Almost on capital! It's ${realCapitalStr}. Try again for name.`;
                    isTypo = true;
                }

                if (isTypo) {
                    feedbackMsg.textContent = msg;
                    feedbackMsg.classList.add("bg-yellow-500/20", "text-yellow-300", "border", "border-yellow-500/30");
                } else {
                    feedbackMsg.textContent = "Try again!";
                    feedbackMsg.classList.add("bg-red-500/20", "text-red-300", "border", "border-red-500/30");
                    // Shake animation for complete error
                    formCard.classList.add('translate-x-1');
                    setTimeout(() => formCard.classList.remove('translate-x-1'), 100);
                    setTimeout(() => formCard.classList.add('-translate-x-1'), 200);
                    setTimeout(() => formCard.classList.remove('-translate-x-1'), 300);
                }
            }
        });

        // Initialize App
        initGlobe();

    </script>
