<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoPlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/topojson-client@3"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Paleta de Cores das Regiões */
            --color-red: #ef4444;     /* Sul / Central */
            --color-purple: #a855f7;  /* Territórios / Norte */
            --color-blue-d: #3b82f6;  /* Oeste */
            --color-blue-l: #38bdf8;  /* Nordeste / Atlântico */
            --color-teal: #14b8a6;    /* Centro-Oeste / Leste */
        }

        body {
            background-color: #0a0a0f;
            color: #f8fafc;
            font-family: 'Playfair Display', serif;
            margin: 0;
            overflow-x: hidden;
        }
        
        /* Liquid Glass Aesthetics */
        .liquid-glass {
            background: rgba(20, 20, 25, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .liquid-input {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
        }
        
        .liquid-input:focus {
            border-color: rgba(255, 255, 255, 0.6);
            outline: none;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .view-container {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .view-container.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Map Styles */
        .map-wrapper {
            position: relative;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            border-radius: 1.5rem;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a1a24 0%, #0a0a0f 100%);
        }

        svg {
            width: 100%;
            height: auto;
            max-height: 650px;
        }

        .land-path {
            cursor: pointer;
            stroke: rgba(255, 255, 255, 0.15);
            stroke-width: 0.5;
            transition: all 0.3s ease;
        }

        .land-path:hover, .europe-group.hovered .land-path {
            stroke: #ffffff;
            stroke-width: 1.5;
            filter: drop-shadow(0 0 5px rgba(255,255,255,0.3));
        }

        .land-path.completed {
            fill: #333333 !important;
            opacity: 0.5;
            pointer-events: none;
        }

        .label-text {
            fill: #ffffff;
            font-size: 11px;
            font-weight: 700;
            text-anchor: middle;
            pointer-events: none;
            font-family: 'Playfair Display', serif;
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }

        /* Floating Card */
        .floating-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            width: 90%;
            max-width: 500px;
            pointer-events: auto;
            transition: opacity 0.3s ease, visibility 0.3s;
        }

        .floating-card.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center">

    <!-- Navbar -->

        <div class="flex items-center gap-4">
            <h1 class="text-3xl font-bold tracking-wider text-white cursor-pointer" onclick="navigate('home')">GeoPlay</h1>
            <button id="btn-home" class="hidden text-sm text-gray-400 hover:text-white transition" onclick="navigate('home')">
                <span data-i18n="navHome">Home</span>
            </button>
        </div>
        <div class="flex gap-2 bg-black/40 p-1 rounded-lg border border-white/10">

            <button onclick="setLang('en')" id="lang-en" class="px-3 py-1 text-sm rounded-md text-gray-400 hover:text-white transition">EN</button>
        </div>
    </nav>

    <main class="w-full max-w-6xl mt-24 px-4 flex-grow flex flex-col">

                <!-- Three/D3 Globe injected here -->
            </div>
        </div>

        <!-- View: MAPS -->

                        <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-[#3b82f6] mr-2 shadow-lg"></span><span data-i18n="regBlueD">Oeste</span></div>
                        <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-[#38bdf8] mr-2 shadow-lg"></span><span data-i18n="regBlueL">Nordeste / Atl.</span></div>
                        <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-[#14b8a6] mr-2 shadow-lg"></span><span data-i18n="regTeal">Centro-Oeste</span></div>
                        <div class="flex items-center"><span class="w-3 h-3 rounded-full bg-[#a855f7] mr-2 shadow-lg"></span><span data-i18n="regPurple">Norte</span></div>
                    </div>
                </div>
                <div class="liquid-glass px-6 py-3 rounded-xl text-center border-white/10 mt-4 md:mt-0">
                    <p class="text-xs text-gray-400 uppercase tracking-widest mb-1" data-i18n="scoreLabel">Pontuação</p>
                    <p class="text-3xl font-bold text-white"><span id="score-current">0</span> <span class="text-lg text-gray-500">/ <span id="score-total">0</span></span></p>
                </div>
            </div>

            <div class="map-wrapper liquid-glass border border-white/10 p-2" id="interactive-map-container">
                <!-- SVG map injected here -->
                
                <!-- Floating Form Card -->
                <div id="quiz-card" class="floating-card liquid-glass rounded-2xl p-8 hidden">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="text-5xl" id="card-flag">🇺🇸</div>
                        <div>

                            <p class="text-sm text-gray-400" id="card-sports-hint"></p>

                    </div>

                    <form id="quiz-form" class="space-y-5">
                        <input type="hidden" id="card-id">
                        <div>

                            <input type="text" id="input-name" class="liquid-input w-full px-4 py-3 rounded-xl transition" required autocomplete="off">
                        </div>
                        <div>

                            <input type="text" id="input-capital" class="liquid-input w-full px-4 py-3 rounded-xl transition" required autocomplete="off">
                        </div>

                        <div class="flex justify-end pt-2">

                        </div>

        // --- 2. Interface Initialization ---
        function setLang(lang) {
            currentLang = lang;
            document.getElementById('lang-pt').className = lang === 'pt' ? 'px-3 py-1 text-sm rounded-md bg-white/20 text-white font-semibold transition' : 'px-3 py-1 text-sm rounded-md text-gray-400 hover:text-white transition';

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) {
                    if (el.tagName === 'INPUT') el.placeholder = i18n[lang][key];
                    else el.textContent = i18n[lang][key];
                }
            });
        }

        function navigate(view) {
            currentView = view;
            document.querySelectorAll('.view-container').forEach(el => el.classList.remove('active'));
            document.getElementById('btn-home').classList.toggle('hidden', view === 'home');
            
            if (view === 'home') {
                document.getElementById('view-home').classList.add('active');
            } else {
                document.getElementById('view-map').classList.add('active');
                initInteractiveMap(view);
            }
        }

        // --- 3. D3 Globe Setup ---
        function initGlobe() {
            const width = 600, height = 600;
            const svg = d3.select("#globe-container").append("svg")
                .attr("viewBox", `0 0 ${width} ${height}`)
                .attr("class", "w-full h-full");

            const projection = d3.geoOrthographic().scale(280).translate([width/2, height/2]).clipAngle(90);
            const path = d3.geoPath().projection(projection);

            // Water
            svg.append("circle")
                .attr("cx", width/2).attr("cy", height/2).attr("r", projection.scale())
                .style("fill", "transparent");

            const g = svg.append("g");

            // Define interaction groups
            const usaCodes = ["840"];
            const canCodes = ["124"];
            const eurCodes = Object.keys(dbEurope); // Approximated by keys

            d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {
                let countries = topojson.feature(world, world.objects.countries).features;

                // Fix France multi-polygon (remove French Guiana for globe aesthetic)
                countries.forEach(d => {
                    if (String(d.id) === "250") {
                        d.geometry.coordinates = d.geometry.coordinates.filter(poly => {
                            const pt = poly[0][0]; // [lon, lat]
                            return pt[0] > -10 && pt[0] < 15 && pt[1] > 35 && pt[1] < 55; // Keep Europe part
                        });
                    }
                });

                const paths = g.selectAll("path")
                    .data(countries)
                    .enter().append("path")
                    .attr("d", path)
                    .attr("stroke", "#0a0a0f")
                    .attr("stroke-width", 0.5)
                    .attr("class", d => {
                        const id = String(d.id).padStart(3, '0');
                        if (eurCodes.includes(id)) return "globe-land europe-group cursor-pointer";
                        if (usaCodes.includes(id)) return "globe-land usa-group cursor-pointer";
                        if (canCodes.includes(id)) return "globe-land can-group cursor-pointer";
                        return "globe-land";
                    })
                    .attr("fill", d => {
                        const id = String(d.id).padStart(3, '0');
                        if (eurCodes.includes(id) || usaCodes.includes(id) || canCodes.includes(id)) return "#ffffff";
                        return "#475569"; // Blocked/Gray
                    })
                    .on("mouseenter", function(e, d) {
                        const id = String(d.id).padStart(3, '0');
                        if (eurCodes.includes(id)) d3.selectAll(".europe-group").style("fill", "#60a5fa");
                        if (usaCodes.includes(id)) d3.select(this).style("fill", "#60a5fa");
                        if (canCodes.includes(id)) d3.select(this).style("fill", "#60a5fa");
                    })
                    .on("mouseleave", function(e, d) {
                        const id = String(d.id).padStart(3, '0');
                        if (eurCodes.includes(id)) d3.selectAll(".europe-group").style("fill", "#ffffff");
                        if (usaCodes.includes(id)) d3.select(this).style("fill", "#ffffff");
                        if (canCodes.includes(id)) d3.select(this).style("fill", "#ffffff");
                    })
                    .on("click", function(e, d) {
                        const id = String(d.id).padStart(3, '0');
                        if (usaCodes.includes(id)) navigate('eua');
                        if (canCodes.includes(id)) navigate('canada');
                        if (eurCodes.includes(id)) navigate('europa');
                    });

                // Auto Rotation
                let rotation = [0, -20];
                d3.timer(() => {
                    rotation[0] += 0.2;
                    projection.rotate(rotation);
                    paths.attr("d", path);
                });

                // Drag Interaction
                const drag = d3.drag().on("drag", event => {
                    const rotate = projection.rotate();
                    const k = 150 / projection.scale();
                    projection.rotate([rotate[0] + event.dx * k, rotate[1] - event.dy * k]);
                    paths.attr("d", path);
                });
                svg.call(drag);
            });
        }

        // --- 4. Interactive Maps Setup ---
        function initInteractiveMap(type) {
            const container = document.getElementById('interactive-map-container');
            // Keep card, remove old svg
            const card = document.getElementById('quiz-card');
            container.innerHTML = '';
            container.appendChild(card);
            closeCard();

            let title = "";
            let dataUrl = "";
            let proj = null;
            let objectKey = "";

            if (type === 'eua') {
                title = "Estados Unidos";
                dataUrl = "https://cdn.jsdelivr.net/npm/us-atlas@3/states-albers-10m.json";
                proj = d3.geoAlbersUsa().scale(1000).translate([500, 300]);
                objectKey = "states";
                mapDataMap = dbUsa;
            } else if (type === 'canada') {
                title = "Canadá";
                dataUrl = "https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/canada.geojson";
                proj = d3.geoConicConformal().rotate([96, 0]).center([0, 62]).parallels([49, 77]).scale(750).translate([500, 300]);
                mapDataMap = dbCanada;
            } else if (type === 'europa') {
                title = "Europa";
                dataUrl = "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json";
                proj = d3.geoMercator().center([12, 51]).scale(650).translate([500, 300]);
                objectKey = "countries";
                mapDataMap = dbEurope;
            }

            document.getElementById('map-title').textContent = title;
            
            // Score Reset
            totalItems = Object.keys(mapDataMap).length;
            currentScore = 0;
            answeredIds = new Set();
            updateScoreDisplay();

            const width = 1000, height = 600;
            const svg = d3.select("#interactive-map-container").insert("svg", ":first-child")
                .attr("viewBox", `0 0 ${width} ${height}`)
                .attr("preserveAspectRatio", "xMidYMid meet");

            const pathGen = d3.geoPath().projection(proj);

            d3.json(dataUrl).then(data => {
                let features = [];
                if (type === 'canada') {
                    features = data.features;
                } else {
                    features = topojson.feature(data, data.objects[objectKey]).features;
                }

                // Inner borders mesh (for TopoJSON)
                if (type !== 'canada') {
                    svg.append("path")
                        .attr("fill", "none")
                        .attr("stroke", "rgba(255,255,255,0.05)")
                        .attr("stroke-width", 1)
                        .attr("d", pathGen(topojson.mesh(data, data.objects[objectKey], (a, b) => a !== b)));
                }

                svg.append("g")
                    .selectAll("path")
                    .data(features)
                    .join("path")
                    .attr("class", d => {
                        let id = getId(d, type);
                        return mapDataMap[id] ? "land-path" : "hidden"; // Hide unmapped
                    })
                    .attr("d", pathGen)
                    .attr("fill", d => {
                        let id = getId(d, type);
                        if (mapDataMap[id]) return colors[mapDataMap[id][0]];
                        return "transparent";
                    })
                    .attr("data-id", d => getId(d, type))
                    .on("click", function(e, d) {
                        let id = getId(d, type);
                        if (mapDataMap[id] && !answeredIds.has(id)) {
                            openCard(id, this);
                        }
                    });

                // Compass Rose (Skeleton)
                const compass = svg.append("g").attr("transform", "translate(920, 520)");
                compass.append("line").attr("x1", 0).attr("y1", -35).attr("x2", 0).attr("y2", 35).attr("stroke", "rgba(255,255,255,0.3)").attr("stroke-width", 1);
                compass.append("line").attr("x1", -35).attr("y1", 0).attr("x2", 35).attr("y2", 0).attr("stroke", "rgba(255,255,255,0.3)").attr("stroke-width", 1);
                const txtStyle = "fill: #fff; font-size: 14px; font-weight: 700; font-family: 'Playfair Display', serif;";
                compass.append("text").attr("x", 0).attr("y", -42).style("text-anchor", "middle").text("N").attr("style", txtStyle);
                compass.append("text").attr("x", 0).attr("y", 50).style("text-anchor", "middle").text("S").attr("style", txtStyle);
                compass.append("text").attr("x", 42).attr("y", 5).style("text-anchor", "start").text("E").attr("style", txtStyle);
                compass.append("text").attr("x", -42).attr("y", 5).style("text-anchor", "end").text("W").attr("style", txtStyle);
            });
        }

        function getId(d, type) {
            if (type === 'canada') {
                let name = d.properties.name;
                if (name === "Newfoundland") return "Newfoundland and Labrador";
                return name;
            }
            if (type === 'eua') return d.id.padStart(2, '0');
            if (type === 'europa') return String(d.id).padStart(3, '0');
            return null;
        }

        // --- 5. Quiz Logic ---
        function openCard(id, element) {
            const data = mapDataMap[id];
            if (!data) return;

            document.getElementById('quiz-card').classList.remove('hidden');
            document.getElementById('card-id').value = id;
            document.getElementById('card-flag').textContent = data[1];
            
            const hint = data[6];
            document.getElementById('card-sports-hint').textContent = hint ? hint : "";
            
            document.getElementById('input-name').value = "";
            document.getElementById('input-capital').value = "";
            
            const feedback = document.getElementById('feedback-msg');
            feedback.classList.add('hidden');
            feedback.className = "text-sm font-semibold rounded-lg py-3 px-4 hidden";

            document.getElementById('input-name').focus();
        }

        function closeCard() {
            document.getElementById('quiz-card').classList.add('hidden');
        }

        function updateScoreDisplay() {
            document.getElementById('score-current').textContent = currentScore;
            document.getElementById('score-total').textContent = totalItems;
        }

        function normalizeStr(str) {
            return str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
        }

        document.getElementById("quiz-form").addEventListener("submit", function(e) {
            e.preventDefault();
            
            const id = document.getElementById('card-id').value;
            const inputName = document.getElementById('input-name').value;
            const inputCap = document.getElementById('input-capital').value;
            const feedback = document.getElementById('feedback-msg');
            
            const data = mapDataMap[id];
            
            // Validate based on current language
            const nameIdx = currentLang === 'en' ? 2 : 4;
            const capIdx = currentLang === 'en' ? 3 : 5;
            
            const realName = data[nameIdx];
            const realCap = data[capIdx];

            const nameCorrect = normalizeStr(inputName) === normalizeStr(realName);
            const capCorrect = normalizeStr(inputCap) === normalizeStr(realCap);

            feedback.classList.remove('hidden');
            
            if (nameCorrect && capCorrect) {
                feedback.textContent = i18n[currentLang].correct.replace('{name}', realName).replace('{cap}', realCap);
                feedback.classList.add("bg-green-900/50", "text-green-400", "border", "border-green-800");
                
                if (!answeredIds.has(id)) {
                    answeredIds.add(id);
                    currentScore++;
                    updateScoreDisplay();
                    d3.selectAll(`path[data-id="${id}"]`).classed("completed", true);
                }
                
                setTimeout(() => { closeCard(); }, 1500);

            } else if (nameCorrect && !capCorrect) {
                feedback.textContent = i18n[currentLang].errCap.replace('{cap}', realCap);
                feedback.classList.add("bg-yellow-900/50", "text-yellow-400", "border", "border-yellow-800");
            } else if (!nameCorrect && capCorrect) {
                feedback.textContent = i18n[currentLang].errName.replace('{name}', realName);
                feedback.classList.add("bg-yellow-900/50", "text-yellow-400", "border", "border-yellow-800");
            } else {
                feedback.textContent = i18n[currentLang].errBoth;
                feedback.classList.add("bg-red-900/50", "text-red-400", "border", "border-red-800");
            }
        });

        // Initialize application
        setLang('pt');
        initGlobe();

    </script>
</body>
</html>
